services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vit-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vit_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vit_assistant_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  vit_assistant_data:
